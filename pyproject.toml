[project]
name = "related-products"
version = "0.1.0"
description = "Picks the 4 related products shown on every product page, from shopper behaviour, sales and search demand"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
